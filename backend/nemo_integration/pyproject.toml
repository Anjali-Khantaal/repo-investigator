[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-investigator-nemo"
version = "0.1.0"
description = "NeMo wrapper plugin for repo-investigator"
requires-python = ">=3.11"
dependencies = [
  "nvidia-nat>=1.6.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_investigator_nemo*"]

[project.entry-points."nat.components"]
repo_investigator_nemo = "repo_investigator_nemo.register"

[project.entry-points."nat.plugins"]
repo_investigator_nemo = "repo_investigator_nemo.register"
